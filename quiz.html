<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset = "utf-8">
        <title>Scene it? - Quiz time!</title>
        <link rel="icon" type="image/png" href="images/favicon1.png">
        <link rel="stylesheet" href="styless/quizstyles.css">
    </head>
    <body>
        <!--Loading screen-->
        <div id="loading-screen">
            <div class="loader-container">
                <div class="spinner"></div>
                <div class="loading-text"> Loading...</div>
            </div>
        </div>
        <!--Loading screen ends-->

        <!--Button sound audio-->
        <audio id="hover-sound" src="sounds/hover-sound.mp3" preload="auto"></audio>
        <audio id="click-sound" src="sounds/click-sound.mp3" preload="auto"></audio>    
        
        <!--Navbar html-->
        <div id="nav-home">
        <header class='navbar'>
            <div class="mainnav">         
                <ul class="navitems">

                    <!--Dropdown elements-->
                    <li>
                        <div class="DROPDOWN">
                            <button class="Learn">
                                Learn
                                    <span class="arrow">↓</span>
                            </button>
                            <div class="LEARNdropdown">
                                <a href="the12principles.html" class="sound" onclick="return confirm('Are you sure you want to leave the quiz? Your current progress will be lost!');">The 12 Principles</a>
                                <a href="funfacts.html" class="sound" onclick="return confirm('Are you sure you want to leave the quiz? Your current progress will be lost!');">Fun Facts</a>
                                <a href="history.html" class="sound" onclick="return confirm('Are you sure you want to leave the quiz? Your current progress will be lost!');">History</a>
                            </div>
                        </div> 
                    </li>
                    <li><a href="index.html" class="Home" onclick="return confirm('Are you sure you want to leave the quiz? Your current progress will be lost!');">Home</a></li>
                    <li><a href="aboutus.html" class="AboutUs" onclick="return confirm('Are you sure you want to leave the quiz? Your current progress will be lost!');">About us</a></li>
                    <li><a href="helppage.html" class="Help" onclick="return confirm('Are you sure you want to leave the quiz? Your current progress will be lost!');">Help</a></li>           
                </ul>
            </div>
            <!--Dropdown menu ends-->

            <!--Background audio-->
            <audio id="background-music" autoplay loop>
                <source src="sounds/Kahoot-Lobby-Music.mp3" type="audio/mpeg">
            </audio>

        </header>
        </div>
        <!--Navbar HTML ends-->

        <!--Quiz/Main section-->
        <main class="quiz-section">
            <span class="question-number" id="question-counter">Question 1 !!</span>
            <div id="quiz">
                <div class="question-box">
                    <h1 id="question"></h1>
                </div>
                <div class="options" id="options-container"></div>
                <p id="feedback"></p>
            </div>
            <button id="next-btn"></button>
        </main> 
    <script src="quizscripts.js"></script>
</body>
</html>
